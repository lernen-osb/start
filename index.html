<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematik und Informatik</title>
<style>
:root{
  --weiss:#FFFFFF; --hell:#F5F5F7; --hell2:#EBEBEF; --text:#1D1D1F; --grau:#6E6E73; --linie:#E5E5EA;
  --blau:#0071E3; --dunkel:#1D1D1F;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif; --code:Consolas,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--weiss);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:56px 28px 72px}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.kicker{font-size:15px;color:var(--grau)}
.datum{font-size:15px;color:var(--grau);font-variant-numeric:tabular-nums}
h1{margin:10px 0 40px;font-size:clamp(40px,6.6vw,68px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
.lead{margin:14px 0 40px;font-size:clamp(19px,2.2vw,22px);color:var(--grau);max-width:660px}
.lead b{color:var(--blau)}

/* Fächer (aufklappbar) */
.fach{background:var(--hell);border-radius:26px;margin-bottom:18px;transition:box-shadow .3s}
.fach.offen{box-shadow:0 16px 40px rgba(0,0,0,.07)}
.fkopf{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;border:0;background:none;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:24px 28px;border-radius:26px}
.fkopf:focus-visible{outline:3px solid var(--blau);outline-offset:3px}
.ficon{width:68px;height:68px;border-radius:18px;background:var(--weiss);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ficon svg{width:36px;height:36px}
.fname{display:block;font-size:clamp(28px,3.8vw,40px);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.finfo{display:block;font-size:16px;color:var(--grau);margin-top:4px}
.pfeil{width:44px;height:44px;border-radius:50%;background:var(--weiss);display:flex;align-items:center;justify-content:center;transition:transform .35s var(--ease),background .25s}
.pfeil svg{width:18px;height:18px}
.fkopf:hover .pfeil{background:var(--hell2)}
.fach.offen .pfeil{transform:rotate(180deg);background:var(--dunkel)}
.fach.offen .pfeil path{stroke:#fff}
.fbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.fach.offen .fbody{grid-template-rows:1fr}
.finner{overflow:hidden}
.fpad{padding:0 28px 28px}

/* Klassen */
.klassen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.klassen button{font:inherit;cursor:pointer;text-align:left;border:0;border-radius:20px;background:var(--weiss);color:var(--text);padding:16px 18px 14px;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s var(--ease),background .25s,color .25s,box-shadow .25s}
.klassen button:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.07)}
.klassen button:focus-visible{outline:3px solid var(--blau);outline-offset:3px}
.klassen .k{font-size:14px;color:var(--grau)}
.klassen .n{font-size:clamp(28px,3.4vw,38px);font-weight:700;line-height:1;letter-spacing:-.02em}
.klassen .n.w{font-size:clamp(21px,2.4vw,26px)}
.klassen .z{font-size:14px;color:var(--grau)}
.klassen button.on{background:var(--dunkel);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.klassen button.on .k,.klassen button.on .z{color:#A1A1A6}

/* Inhalte */
.inhalt{margin-top:26px}
.hinweis{color:var(--grau);font-size:17px;padding:6px 2px}
.kopf2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
h2{margin:2px 0 0;font-size:clamp(24px,3vw,32px);font-weight:700}
.anzahl{font-size:15px;color:var(--grau)}
.list{display:grid;gap:14px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;text-decoration:none;color:inherit;background:var(--weiss);border-radius:22px;padding:22px 24px;transition:transform .25s var(--ease),box-shadow .25s;animation:rein .4s var(--ease) backwards}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.08)}
.card:focus-visible{outline:3px solid var(--blau);outline-offset:3px}
.icon{width:60px;height:60px;border-radius:16px;background:var(--hell);display:flex;align-items:center;justify-content:center;font-size:30px}
.card h3{margin:0;font-size:clamp(20px,2.3vw,23px);font-weight:700;line-height:1.25}
.card p{margin:6px 0 0;font-size:18px;color:var(--grau)}
.pille{display:inline-block;margin-top:12px;font-size:14px;color:var(--text);background:var(--hell);border-radius:999px;padding:4px 12px}
.start{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--blau);color:#fff;font-weight:700;font-size:18px;border-radius:999px;padding:12px 22px;transition:background .2s}
.card:hover .start{background:#0077ED}
.card.fehlt{pointer-events:none}
.card.fehlt .start{background:var(--linie);color:var(--grau)}
.card.fehlt h3,.card.fehlt .icon{opacity:.5}
.leer{background:var(--weiss);border-radius:22px;padding:40px 24px;text-align:center;color:var(--grau);animation:rein .4s var(--ease) backwards}
.leer b{display:block;color:var(--text);font-size:21px;margin-bottom:4px}
@keyframes rein{from{opacity:0;transform:translateY(14px)}}

footer{margin-top:40px;font-size:15px;color:var(--grau)}
footer code{font-family:var(--code);font-size:15px;color:var(--text);background:var(--hell);border-radius:8px;padding:2px 8px;word-break:break-all}

@media (max-width:760px){
  .wrap{padding:32px 16px 56px}
  .fkopf{padding:18px;gap:14px}
  .ficon{width:54px;height:54px;border-radius:15px}
  .ficon svg{width:28px;height:28px}
  .fpad{padding:0 16px 18px}
  .klassen{grid-template-columns:repeat(2,1fr);gap:10px}
  .klassen button{min-height:92px}
  .card{grid-template-columns:auto 1fr;gap:14px;padding:18px}
  .icon{width:50px;height:50px;font-size:25px;border-radius:14px}
  .start{grid-column:1/-1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){ .card,.leer{animation:none} .fbody,.pfeil,.klassen button,.card{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="kicker">Lernspiele und Material</span>
    <span class="datum" id="datum"></span>
  </div>
  <h1>Mathematik und Informatik</h1>

  <div id="faecher"></div>

</div>

<script>
/* =====================================================================
   HIER DIE INHALTE EINTRAGEN
   ---------------------------------------------------------------------
   Aufbau:  "Fach": { "Klasse": [ Einträge ] }
   Ein Eintrag sieht so aus:
     { titel: "…", text: "…", datei: "dateiname.html", icon: "🔐", thema: "…" }
   - datei: genau so geschrieben wie auf GitHub (Groß-/Kleinschreibung!)
   - icon und thema dürfen auch weggelassen werden
   - mehrere Einträge mit Komma trennen
   - eine neue Klasse anlegen:  "Klasse 6": [],
   Leere Klassen zeigen automatisch „Hier kommt bald etwas“.
   ===================================================================== */
var FAECHER = {

  "Mathematik": {
    "Klasse 5": [],
    "Sonstiges": []
  },

  "Informatik": {
    "Klasse 7": [
      { titel: "Operation Tresor – Binär-Hack",
        text:  "Knacke Dr. Nulls Firewalls: Binärzahlen umrechnen, Bits und Bytes, Zusatzlevel ASCII.",
        datei: "operation-tresor-binaer-hack_2.1.html", icon: "🔐", thema: "Zahlensysteme" }
    ],
    "Klasse 8": [],
    "Klasse 9": [],
    "Klasse 10": [],
    "Sonstiges": [
      { titel: "Operation Tresor – Junior",
        text:  "Die Hacker-Mission für Grundschüler: Lampen-Code, Geheimbild aus 0 und 1 und Dr. Nulls Tresor.",
        datei: "operation-tresor-junior.html", icon: "🕵️", thema: "Tag der offenen Tür" }
    ]
  }

};
/* ===================================================================== */

(function(){
  "use strict";
  var ICONS = {
    "Mathematik": '<svg viewBox="0 0 36 36" fill="none" stroke="#1D1D1F" stroke-width="2.6" stroke-linecap="round"><path d="M9 6v10M4 11h10"/><path d="M22 11h10"/><path d="M5 24l8 8M13 24l-8 8"/><path d="M22 26h10M22 31h10"/></svg>',
    "Informatik": '<svg viewBox="0 0 36 36" fill="none" stroke="#1D1D1F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="28" height="19" rx="3"/><path d="M13 31h10M18 25v6"/><path d="M12 13l-3 3 3 3M24 13l3 3-3 3M20 12l-4 8"/></svg>'
  };
  var PFEIL = '<svg viewBox="0 0 18 18" fill="none"><path d="M4 7l5 5 5-5" stroke="#1D1D1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var online = /^https?:/.test(location.protocol), box = document.getElementById("faecher"), F = {};

  function slug(s){ return s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\s+/g,""); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function zahl(n){ return n ? n+(n===1?" Eintrag":" Einträge") : "bald"; }
  function nr(k){ var m = k.match(/^Klasse\s+(\d+)/); return m ? m[1] : null; }

  var d = new Date();
  document.getElementById("datum").textContent = ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+d.getFullYear();

  Object.keys(FAECHER).forEach(function(fach){
    var klassen = FAECHER[fach], ks = Object.keys(klassen), gesamt = 0;
    ks.forEach(function(k){ gesamt += klassen[k].length; });
    var el = document.createElement("section"); el.className = "fach";
    el.innerHTML =
      '<button type="button" class="fkopf" aria-expanded="false">'+
        '<span class="ficon" aria-hidden="true">'+(ICONS[fach]||"")+'</span>'+
        '<span><span class="fname">'+esc(fach)+'</span><span class="finfo">'+ks.length+(ks.length===1?" Bereich":" Bereiche")+' · '+zahl(gesamt).replace("bald","noch keine Einträge")+'</span></span>'+
        '<span class="pfeil" aria-hidden="true">'+PFEIL+'</span>'+
      '</button>'+
      '<div class="fbody"><div class="finner"><div class="fpad">'+
        '<div class="klassen"></div><div class="inhalt"><div class="hinweis">Wähle oben deine Klasse.</div></div>'+
      '</div></div></div>';
    var grid = el.querySelector(".klassen");
    ks.forEach(function(k){
      var b = document.createElement("button"), n = nr(k);
      b.type = "button"; b.dataset.k = k;
      b.innerHTML = n ? '<span class="k">Klasse</span><span class="n">'+n+'</span><span class="z">'+zahl(klassen[k].length)+'</span>'
                      : '<span class="k">&nbsp;</span><span class="n w">'+esc(k)+'</span><span class="z">'+zahl(klassen[k].length)+'</span>';
      b.addEventListener("click",function(){ zeige(fach,k,true); });
      grid.appendChild(b);
    });
    el.querySelector(".fkopf").addEventListener("click",function(){ klappe(fach, !el.classList.contains("offen"), true); });
    box.appendChild(el);
    F[fach] = el;
  });

  function klappe(fach, auf, merken){
    Object.keys(F).forEach(function(f){
      var o = (f===fach) && auf;
      F[f].classList.toggle("offen",o); F[f].querySelector(".fkopf").setAttribute("aria-expanded",o);
    });
    if(merken && history.replaceState) history.replaceState(null,"", auf ? "#"+slug(fach) : location.pathname);
  }

  function zeige(fach, k, merken){
    var el = F[fach], items = FAECHER[fach][k], n = nr(k);
    klappe(fach,true,false);
    Array.prototype.forEach.call(el.querySelectorAll(".klassen button"),function(b){ var on = b.dataset.k===k; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); });
    var h = '<div class="kopf2"><div><div class="kicker">'+esc(fach)+(n?" · Klasse "+n:" · Weitere Angebote")+'</div><h2>'+esc(n?"Klasse "+n:k)+'</h2></div>'+
            '<span class="anzahl">'+(items.length?zahl(items.length):"")+'</span></div><div class="list">';
    if(!items.length) h += '<div class="leer"><b>Hier kommt bald etwas.</b>Schau später noch einmal vorbei.</div>';
    items.forEach(function(it,i){
      h += '<a class="card" style="animation-delay:'+(i*.07)+'s" href="'+encodeURI(it.datei)+'">'+
           '<span class="icon" aria-hidden="true">'+(it.icon||"📄")+'</span>'+
           '<span><h3>'+esc(it.titel)+'</h3>'+(it.text?'<p>'+esc(it.text)+'</p>':'')+(it.thema?'<span class="pille">'+esc(it.thema)+'</span>':'')+'</span>'+
           '<span class="start">Starten <span aria-hidden="true">›</span></span></a>';
    });
    el.querySelector(".inhalt").innerHTML = h+'</div>';
    if(merken && history.replaceState) history.replaceState(null,"","#"+slug(fach)+"-"+slug(k));
    if(online) Array.prototype.forEach.call(el.querySelectorAll(".card"),function(c){
      fetch(c.getAttribute("href"),{method:"HEAD",cache:"no-store"}).then(function(r){
        if(!r.ok){ c.classList.add("fehlt"); c.querySelector(".start").textContent = "Noch nicht online"; }
      }).catch(function(){});
    });
  }

  /* Direktadressen wie #informatik-klasse7, #mathe-klasse5 oder #informatik */
  function ausAdresse(){
    var h = decodeURIComponent(location.hash.replace("#","")).toLowerCase();
    if(h==="anderes") h = "informatik-sonstiges";
    if(h.indexOf("mathe")===0 && h.indexOf("mathematik")!==0) h = "mathematik"+h.slice(5);
    if(!h) return;
    Object.keys(FAECHER).forEach(function(fach){
      if(h===slug(fach)) klappe(fach,true,false);
      Object.keys(FAECHER[fach]).forEach(function(k){ if(h===slug(fach)+"-"+slug(k)) zeige(fach,k,false); });
    });
  }
  ausAdresse();
  addEventListener("hashchange",ausAdresse);
})();
</script>
</body>
</html>
